name: Update UniStore
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths: [repos.txt, generate.py]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "unistore-bot"
          git config user.email "bot@users.noreply.github.com"
          git add unistore.unistore
          git diff --cached --quiet || git commit -m "Update UniStore" && git push
